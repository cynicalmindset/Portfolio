<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>portfolio_game.exe</title>
		<style>
* {
	box-sizing: border-box;
}
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: #ffffff;
	background-color: #09090b;
	overflow: hidden;
	touch-action: none;
	font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background: #09090b;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	z-index: 10;
	padding: 24px;
}

.loader-container {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 16px;
	max-width: 380px;
	width: 100%;
	text-align: center;
}

.loader-spinner {
	width: 36px;
	height: 36px;
	border: 3px solid rgba(255, 255, 255, 0.1);
	border-top-color: #10b981;
	border-radius: 50%;
	animation: spin 0.8s linear infinite;
}

@keyframes spin {
	to { transform: rotate(360deg); }
}

.loader-title {
	font-family: 'JetBrains Mono', monospace, monospace;
	font-size: 13px;
	font-weight: 600;
	color: #ffffff;
	letter-spacing: 0.05em;
}

.progress-track {
	width: 100%;
	height: 6px;
	background: rgba(255, 255, 255, 0.12);
	border-radius: 999px;
	overflow: hidden;
	position: relative;
}

.progress-fill {
	height: 100%;
	width: 0%;
	background: #10b981;
	border-radius: 999px;
	transition: width 0.15s ease;
}

.progress-subtext {
	font-family: 'JetBrains Mono', monospace, monospace;
	font-size: 11px;
	color: #9ca3af;
}

#status-notice {
	background-color: rgba(239, 68, 68, 0.15);
	border-radius: 6px;
	border: 1px solid rgba(239, 68, 68, 0.4);
	color: #fca5a5;
	font-size: 12px;
	line-height: 1.4;
	margin-top: 12px;
	padding: 10px 14px;
	text-align: center;
	display: none;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="portfolio_game.icon.png" />
		<link rel="apple-touch-icon" href="portfolio_game.apple-touch-icon.png"/>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the HTML5 canvas tag.
		</canvas>

		<div id="status">
			<div class="loader-container">
				<div class="loader-spinner"></div>
				<div class="loader-title">INITIALIZING PORTFOLIO_GAME.EXE</div>
				<div class="progress-track">
					<div id="progress-fill" class="progress-fill"></div>
				</div>
				<div id="progress-text" class="progress-subtext">Streaming game engine &amp; assets...</div>
				<div id="status-notice"></div>
			</div>
		</div>

		<script src="portfolio_game.js"></script>
		<script>
const GODOT_CONFIG = {
	"args": [],
	"canvasResizePolicy": 2,
	"emscriptenPoolSize": 8,
	"ensureCrossOriginIsolationHeaders": false,
	"executable": "portfolio_game",
	"experimentalVK": false,
	"fileSizes": {
		"portfolio_game.pck": 56112548,
		"portfolio_game.wasm": 37700666
	},
	"focusCanvas": true,
	"gdextensionLibs": [],
	"godotPoolSize": 4
};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const progressFill = document.getElementById('progress-fill');
	const progressText = document.getElementById('progress-text');
	const statusNotice = document.getElementById('status-notice');

	function setStatusNotice(text) {
		statusNotice.style.display = 'block';
		statusNotice.textContent = text;
	}

	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice(err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An error occurred while loading.'));
	}

	const totalExpectedBytes = 56112548 + 37700666; // 93.8 MB

	engine.startGame({
		'onProgress': function (current, total) {
			const max = total > 0 ? total : totalExpectedBytes;
			if (current > 0 && max > 0) {
				const percent = Math.min(100, Math.round((current / max) * 100));
				progressFill.style.width = percent + '%';
				const mbCurrent = (current / (1024 * 1024)).toFixed(1);
				const mbTotal = (max / (1024 * 1024)).toFixed(1);
				progressText.textContent = `Downloading game assets: ${percent}% (${mbCurrent}MB / ${mbTotal}MB)`;
			}
		},
	}).then(() => {
		if (statusOverlay) {
			statusOverlay.style.opacity = '0';
			statusOverlay.style.transition = 'opacity 0.3s ease';
			setTimeout(() => statusOverlay.remove(), 300);
		}
	}).catch(displayFailureNotice);
}());
		</script>
	</body>
</html>
